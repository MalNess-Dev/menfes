<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008388" />
      <stop offset="60%" stop-color="#006569" />
      <stop offset="100%" stop-color="#004548" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#FFDD00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002D30" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="115" ry="115" fill="url(#bgGrad)" />
  <rect x="22" y="22" width="468" height="468" rx="110" ry="110" fill="none" stroke="#FFDD00" stroke-width="10" stroke-opacity="0.35" />

  <!-- Collegiate / Bold U -->
  <g filter="url(#shadow)">
    <!-- Main U Body -->
    <path d="
      M 116 120
      H 220
      V 152
      H 194
      V 276
      C 194 332, 222 346, 256 346
      C 290 346, 318 332, 318 276
      V 152
      H 292
      V 120
      H 396
      V 152
      H 370
      V 274
      C 370 384, 320 408, 256 408
      C 192 408, 142 384, 142 274
      V 152
      H 116
      Z
    " fill="url(#goldGrad)" stroke="#E0B800" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent Top Right -->
  <g transform="translate(390, 80)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="#FFF275" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>
</svg>